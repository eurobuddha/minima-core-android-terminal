plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'org.minimarex.terminal'
    compileSdk 36

    defaultConfig {
        applicationId "org.minimarex.terminal"
        minSdk 28
        targetSdk 35
        versionCode 2
        versionName "1.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sign release with the debug keystore, matching the minima-core-android node app.
            // IPC is authorized by the MINIMA_ID token, not by signature, so this is sufficient
            // for sideloading. NB: the original dist/terminal-1.0.apk is Spartacus Rex-signed -
            // updating an installed copy of that requires uninstall first.
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {

    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core

    implementation files('libs/minimaapi.aar')
}